global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Hosts listed in prometheus/targets/node.yml (edit the file, no restart needed).
  - job_name: node
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/node.yml
        refresh_interval: 1m

  # --- Optional: auto-discover EC2 instances instead of listing them by hand ---
  # Attach an IAM role with ec2:DescribeInstances to this host, then uncomment.
  # Only instances tagged Monitoring=true are scraped.
