route:
  receiver: default
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # Default receiver does nothing, so the stack starts cleanly.
  # Alerts are still visible in Prometheus (/alerts), Alertmanager (:9093) and Grafana.
  - name: default

  # --- Example: email via SMTP (e.g. Amazon SES) ---
  # Replace the receiver above with this, or add it and route to it.
  #
  # - name: email
  #   email_configs:
  #     - to: you@example.com
  #       from: alerts@example.com
  #       smarthost: email-smtp.ap-south-1.amazonaws.com:587
  #       auth_username: SES_SMTP_USERNAME
  #       auth_password: SES_SMTP_PASSWORD
  #       send_resolved: true
  #
  # --- Example: Slack ---
  # - name: slack
  #   slack_configs:
  #     - api_url: https://hooks.slack.com/services/XXX/YYY/ZZZ
  #       channel: "#alerts"
  #       send_resolved: true

inhibit_rules:
  # If a host is down, suppress its warning-level alerts.
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [instance]
